<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lessandra HOA Registry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#16233A;
    --steel:#3D5A80;
    --parchment:#EFE9DB;
    --paper:#F5F3EE;
    --card:#FFFFFF;
    --line:#E1DCCF;
    --gold:#C98A3D;
    --gold-dark:#A76F2C;
    --green:#5B8266;
    --red:#B0413E;
    --amber:#C98A3D;
    --text:#1B2430;
    --text-soft:#5B6472;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--text);font-family:'IBM Plex Sans',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .serif{font-family:'Fraunces',serif;}
  a{color:inherit;}

  /* ---- layout ---- */
  #app{display:flex;min-height:100vh;}
  #sidebar{
    width:236px;flex:0 0 236px;background:var(--ink);color:#EDE7D6;
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
    z-index:20;transition:transform .25s ease;
  }
  .brand{padding:22px 20px 16px;border-bottom:1px solid rgba(237,231,214,0.12);}
  .brand .name{font-family:'Fraunces',serif;font-size:19px;font-weight:600;line-height:1.15;}
  .brand .tag{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-top:5px;font-weight:600;}
  nav{flex:1;overflow-y:auto;padding:10px 0;}
  .navgroup-label{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#8C93A6;padding:14px 20px 6px;}
  .navitem{
    display:flex;align-items:center;gap:10px;padding:9px 20px;font-size:13.5px;font-weight:500;
    color:#C9CFDD;cursor:pointer;border-left:3px solid transparent;
  }
  .navitem .num{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#6C7488;width:16px;flex:0 0 16px;}
  .navitem:hover{background:rgba(255,255,255,0.04);color:#fff;}
  .navitem.active{background:rgba(201,138,61,0.14);color:#fff;border-left-color:var(--gold);}
  .navitem.active .num{color:var(--gold);}
  .sidebar-foot{padding:14px 20px;border-top:1px solid rgba(237,231,214,0.12);font-size:11px;color:#7C8496;}

  #main{flex:1;min-width:0;}
  #topbar{
    display:none;align-items:center;justify-content:space-between;background:var(--ink);color:#fff;
    padding:12px 16px;position:sticky;top:0;z-index:15;
  }
  #topbar .name{font-family:'Fraunces',serif;font-weight:600;}
  #menuBtn{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:6px 10px;font-size:16px;}
  #content{padding:30px 34px 70px;max-width:1180px;}

  .pagehead{margin-bottom:22px;}
  .pagehead h1{font-family:'Fraunces',serif;font-size:26px;font-weight:600;margin:0 0 4px;}
  .pagehead p{margin:0;color:var(--text-soft);font-size:13.5px;}

  /* ---- cards / grid ---- */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:26px;}
  .stat-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;position:relative;overflow:hidden;}
  .stat-card .stat-label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-soft);font-weight:600;}
  .stat-card .stat-value{font-family:'Fraunces',serif;font-size:28px;font-weight:600;margin-top:6px;}
  .stat-card .stat-sub{font-size:11.5px;color:var(--text-soft);margin-top:2px;}
  .stat-card.accent{border-color:var(--gold);}
  .stat-card.accent::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--gold);}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:22px;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);}
  .panel-head h2{font-family:'Fraunces',serif;font-size:16.5px;font-weight:600;margin:0;}
  .panel-body{padding:16px 18px;}

  .two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;}
  @media (max-width:900px){.two-col{grid-template-columns:1fr;}}

  /* ---- ledger stamp badges ---- */
  .stamp{
    display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;
    letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:3px;
    border:1.4px solid currentColor;transform:rotate(-2deg);white-space:nowrap;
  }
  .stamp.paid, .stamp.active, .stamp.published, .stamp.resolved{color:var(--green);background:rgba(91,130,102,0.08);}
  .stamp.unpaid, .stamp.open, .stamp.draft{color:var(--steel);background:rgba(61,90,128,0.08);}
  .stamp.overdue, .stamp.delinquent, .stamp.urgent, .stamp.inactive{color:var(--red);background:rgba(176,65,62,0.08);}
  .stamp.partial, .stamp.pending, .stamp.medium, .stamp.progress{color:var(--gold-dark);background:rgba(201,138,61,0.1);}

  .bl-tag{
    display:inline-flex;align-items:center;gap:4px;font-family:'IBM Plex Mono',monospace;font-size:11px;
    background:var(--parchment);border:1px solid var(--line);border-radius:5px;padding:2px 7px;color:var(--ink);
  }

  .thumb{width:36px;height:36px;border-radius:50%;object-fit:cover;border:1.5px solid var(--line);display:block;}
  .thumb-empty{display:flex;align-items:center;justify-content:center;background:var(--steel);color:#fff;font-size:11px;font-weight:700;font-family:'IBM Plex Mono',monospace;}
  .photo-upload{display:flex;align-items:center;gap:12px;}
  .photo-upload .thumb, .photo-upload .thumb-empty{width:64px;height:64px;font-size:18px;}
  .photo-upload input[type=file]{font-size:12px;}
  .photo-remove{background:none;border:none;color:var(--red);font-size:11.5px;font-weight:600;cursor:pointer;text-decoration:underline;padding:0;}

  /* ---- table ---- */
  .table-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
  input[type=text],input[type=search],input[type=number],input[type=date],input[type=month],input[type=email],select,textarea{
    font-family:inherit;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;
    background:#fff;color:var(--text);outline:none;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--steel);box-shadow:0 0 0 3px rgba(61,90,128,0.12);}
  .search-box{flex:1;min-width:180px;}
  .btn{
    font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:13px;padding:9px 16px;border-radius:7px;
    border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  }
  .btn-gold{background:var(--gold);color:#241705;}
  .btn-gold:hover{background:var(--gold-dark);}
  .btn-ghost{background:transparent;border-color:var(--line);color:var(--text);}
  .btn-ghost:hover{border-color:var(--steel);color:var(--steel);}
  .btn-danger-text{background:none;border:none;color:var(--red);font-size:12.5px;font-weight:600;cursor:pointer;padding:2px 4px;}
  .btn-link-text{background:none;border:none;color:var(--steel);font-size:12.5px;font-weight:600;cursor:pointer;padding:2px 4px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-soft);
    padding:8px 10px;border-bottom:1.5px solid var(--ink);white-space:nowrap;
  }
  tbody td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:hover{background:rgba(61,90,128,0.04);}
  .num-cell{font-family:'IBM Plex Mono',monospace;text-align:right;white-space:nowrap;}
  .id-cell{font-family:'IBM Plex Mono',monospace;color:var(--text-soft);}
  .table-scroll{overflow-x:auto;}
  .empty-state{padding:44px 20px;text-align:center;color:var(--text-soft);}
  .empty-state .serif{font-size:17px;color:var(--text);display:block;margin-bottom:6px;}

  /* ---- modal ---- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(22,35,58,0.5);display:flex;align-items:flex-start;justify-content:center;
    padding:40px 16px;overflow-y:auto;z-index:100;
  }
  .modal{background:#fff;border-radius:12px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line);}
  .modal-head h3{font-family:'Fraunces',serif;font-size:18px;margin:0;}
  .modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-soft);}
  .modal-body{padding:20px 22px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .modal-body .full{grid-column:1/-1;}
  .field label{display:block;font-size:11.5px;font-weight:600;color:var(--text-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em;}
  .field input,.field select,.field textarea{width:100%;}
  .field textarea{resize:vertical;min-height:60px;}
  .modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}

  .badge-count{background:var(--gold);color:#241705;font-size:10.5px;font-weight:700;border-radius:10px;padding:1px 7px;margin-left:6px;}

  .chart-wrap{position:relative;height:230px;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:10px 18px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:200;
    opacity:0;transition:opacity .25s ease;pointer-events:none;
  }
  .toast.show{opacity:1;}

  /* ---- login gate ---- */
  #loginScreen{
    position:fixed;inset:0;background:var(--ink);display:flex;align-items:center;justify-content:center;
    z-index:300;padding:20px;
  }
  .login-card{
    background:#fff;border-radius:14px;padding:34px 30px;width:100%;max-width:360px;
    box-shadow:0 30px 80px rgba(0,0,0,.35);text-align:center;
  }
  .login-card .lock-icon{
    width:44px;height:44px;border-radius:50%;background:var(--parchment);border:1.4px solid var(--gold);
    display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:19px;color:var(--gold-dark);
  }
  .login-card h2{font-family:'Fraunces',serif;font-size:20px;margin:0 0 4px;}
  .login-card p{font-size:12.5px;color:var(--text-soft);margin:0 0 18px;}
  .login-card input{width:100%;text-align:center;letter-spacing:.3em;font-size:18px;padding:11px;margin-bottom:12px;}
  .login-card .btn{width:100%;justify-content:center;}
  .login-error{color:var(--red);font-size:12px;margin:-4px 0 12px;min-height:14px;}
  .logout-link{background:none;border:none;color:#9AA2B4;font-size:11.5px;cursor:pointer;padding:0;text-decoration:underline;}

  .banner-note{
    background:var(--parchment);border:1px solid var(--line);border-left:4px solid var(--gold);
    border-radius:6px;padding:10px 14px;font-size:12.5px;color:var(--text-soft);margin-bottom:16px;
  }

  /* ---- receipt ---- */
  .receipt-box{
    background:#fff;border:1.5px solid var(--ink);border-radius:8px;max-width:480px;margin:0 auto;
    padding:24px 26px;
  }
  .receipt-hoa{font-family:'Fraunces',serif;font-size:19px;font-weight:600;text-align:center;}
  .receipt-addr{font-size:11.5px;color:var(--text-soft);text-align:center;font-style:italic;margin-bottom:10px;}
  .receipt-title{background:var(--ink);color:#fff;text-align:center;font-weight:700;letter-spacing:.05em;padding:8px;border-radius:4px;margin-bottom:14px;font-size:14px;}
  .receipt-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:12px;}
  .receipt-table td{padding:5px 4px;border-bottom:1px solid var(--line);}
  .receipt-table td:first-child{font-weight:600;color:var(--text-soft);width:55%;}
  .receipt-table td:last-child{text-align:right;font-family:'IBM Plex Mono',monospace;}
  .receipt-status{text-align:center;font-weight:700;padding:8px;border-radius:5px;margin-bottom:14px;font-size:13px;letter-spacing:.03em;}
  .receipt-status.paidfull{background:rgba(91,130,102,0.12);color:var(--green);}
  .receipt-status.partial{background:rgba(201,138,61,0.14);color:var(--gold-dark);}
  .receipt-status.unpaid{background:rgba(61,90,128,0.12);color:var(--steel);}
  .receipt-field{font-size:12.5px;margin-bottom:16px;}
  .receipt-sign{display:flex;justify-content:space-between;gap:20px;margin-bottom:16px;}
  .sig-line{border-bottom:1px solid var(--text);height:28px;}
  .sig-label{font-size:10.5px;color:var(--text-soft);font-style:italic;margin-top:3px;text-align:center;}
  .receipt-footer{font-size:10px;color:var(--text-soft);font-style:italic;text-align:center;}
  .announce-box{max-width:600px;text-align:left;}
  .announce-title{font-family:'Fraunces',serif;font-size:20px;font-weight:600;text-align:center;margin:4px 0 6px;}
  .announce-meta{font-size:11.5px;color:var(--text-soft);text-align:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line);}
  .announce-body{font-size:14px;line-height:1.7;margin-bottom:20px;white-space:pre-wrap;}
  .print-page{page-break-after:always;padding:20px 0;}
  .print-page:last-child{page-break-after:auto;}

  .print-only{display:none;}
  .report-letterhead{text-align:center;margin-bottom:18px;}
  .report-letterhead .receipt-title{max-width:520px;margin:0 auto;}

  @media print{
    #sidebar, #topbar, .no-print{display:none !important;}
    #content{padding:0;max-width:none;}
    body{background:#fff;}
    .receipt-box{border-color:#000;}
    .print-only{display:block;}

    .announce-box{
      max-width:none; width:100%; min-height:96vh; box-sizing:border-box;
      border:2px solid #000; border-radius:0; padding:50px 60px;
      display:flex; flex-direction:column; justify-content:flex-start;
    }
    .announce-box .receipt-hoa{font-size:26px;}
    .announce-box .receipt-addr{font-size:13px; margin-bottom:14px;}
    .announce-box .receipt-title{font-size:16px; padding:12px; margin-bottom:24px;}
    .announce-box .announce-title{font-size:30px; margin:10px 0 14px;}
    .announce-box .announce-meta{font-size:13.5px; padding-bottom:20px; margin-bottom:28px;}
    .announce-box .announce-body{font-size:18px; line-height:2; flex:1;}
    .announce-box .receipt-footer{font-size:12px; margin-top:30px;}
  }

  @media (max-width:820px){
    #sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);width:230px;}
    #sidebar.open{transform:translateX(0);}
    #topbar{display:flex;}
    #content{padding:20px 16px 60px;}
    .modal-body{grid-template-columns:1fr;}
    .two-col{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="name" id="brandName">Lessandra</div>
      <div class="tag">Association Ledger</div>
    </div>
    <nav id="navList"></nav>
    <div class="sidebar-foot">
      <span style="display:block;font-size:10.5px;color:#7C8496;margin-bottom:8px;">Saved locally on this device/browser only.</span>
      <button class="logout-link" id="logoutBtn">Lock / Log out</button>
    </div>
  </aside>

  <div id="main">
    <div id="topbar">
      <button id="menuBtn">☰</button>
      <div class="name" id="topbarName">Lessandra</div>
      <div style="width:34px;"></div>
    </div>
    <div id="content"></div>
  </div>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   DATA LAYER
===================================================================== */
const STORE_PREFIX = 'lessandra_hoa:';
const cache = {};
let STORAGE_OK = true;

async function loadData(key, fallback){
  try{
    const raw = localStorage.getItem(STORE_PREFIX+key);
    if(raw){ cache[key] = JSON.parse(raw); return cache[key]; }
    cache[key] = fallback; return fallback;
  }catch(e){ STORAGE_OK = false; cache[key] = fallback; return fallback; }
}
async function saveData(key, value){
  cache[key] = value;
  try{ localStorage.setItem(STORE_PREFIX+key, JSON.stringify(value)); }
  catch(e){ STORAGE_OK = false; showToast('Could not save — your browser storage may be full or disabled'); }
}
function nextId(prefix, arr){
  let max = 0;
  arr.forEach(r=>{
    const m = String(r.id||'').match(/(\d+)$/);
    if(m) max = Math.max(max, parseInt(m[1],10));
  });
  return prefix + '-' + String(max+1).padStart(4,'0');
}

/* =====================================================================
   SCHEMA — mirrors the original workbook's sheets
===================================================================== */
const MODULES = {
  members: {
    label:'Homeowners', idPrefix:'M', icon:'01',
    fields:[
      {key:'photo', label:'Photo', type:'photo'},
      {key:'lastName', label:'Last Name', type:'text', required:true},
      {key:'firstName', label:'First Name', type:'text', required:true},
      {key:'middleName', label:'Middle Name', type:'text'},
      {key:'contact', label:'Contact No.', type:'text'},
      {key:'email', label:'Email', type:'email'},
      {key:'block', label:'Block', type:'text'},
      {key:'lot', label:'Lot', type:'text'},
      {key:'dateRegistered', label:'Date Registered', type:'date'},
      {key:'status', label:'Status', type:'select', options:['Active','Inactive'], default:'Active'},
      {key:'notes', label:'Notes', type:'textarea', full:true},
    ],
    columns:['photo','name','blocklot','contact','email','status'],
  },
  properties: {
    label:'Properties', idPrefix:'P', icon:'02',
    fields:[
      {key:'block', label:'Block', type:'text', required:true},
      {key:'lot', label:'Lot', type:'text', required:true},
      {key:'street', label:'Street', type:'text'},
      {key:'houseType', label:'House Type', type:'text'},
      {key:'ownerMemberId', label:'Owner', type:'ref', ref:'members'},
      {key:'occupancy', label:'Occupancy', type:'select', options:['Owner','Lessee','Renter','Vacant'], default:'Owner'},
      {key:'dateRented', label:'Date Rented', type:'date'},
      {key:'monthlyDue', label:'Monthly Due', type:'number'},
      {key:'status', label:'Status', type:'select', options:['Active','Inactive'], default:'Active'},
      {key:'dateAcquired', label:'Date Acquired', type:'date'},
      {key:'notes', label:'Notes', type:'textarea', full:true},
    ],
    columns:['blocklot','street','owner','occupancy','dateRented','monthlyDue','status'],
  },
  billing: {
    label:'Monthly Dues', idPrefix:'MD', icon:'03',
    fields:[
      {key:'propertyId', label:'Property', type:'ref', ref:'properties', required:true},
      {key:'memberId', label:'Homeowner', type:'ref', ref:'members'},
      {key:'billingMonth', label:'Dues Month', type:'month'},
      {key:'dueDate', label:'Due Date', type:'date'},
      {key:'amountDue', label:'Amount Due', type:'number', required:true},
      {key:'amountPaid', label:'Amount Paid', type:'number', default:0},
      {key:'status', label:'Status', type:'select', options:['Unpaid','Partial','Paid','Overdue'], default:'Unpaid'},
      {key:'notes', label:'Notes', type:'textarea', full:true},
    ],
    columns:['propertyId','memberId','billingMonth','amountDue','amountPaid','balance','status'],
  },
  payments: {
    label:'Payments', idPrefix:'PM', icon:'04',
    fields:[
      {key:'date', label:'Date', type:'date', required:true},
      {key:'billId', label:'Monthly Due Bill', type:'ref', ref:'billing'},
      {key:'memberId', label:'Homeowner', type:'ref', ref:'members'},
      {key:'propertyId', label:'Property', type:'ref', ref:'properties'},
      {key:'amount', label:'Amount', type:'number', required:true},
      {key:'paymentMethod', label:'Payment Method', type:'select', options:['Cash','Check','Bank Transfer','GCash','Other'], default:'Cash'},
      {key:'referenceNo', label:'Reference No.', type:'text'},
      {key:'receivedBy', label:'Received By', type:'text'},
      {key:'notes', label:'Notes', type:'textarea', full:true},
    ],
    columns:['date','memberId','propertyId','amount','paymentMethod','referenceNo'],
  },
  rentals: {
    label:'Facility Rentals', idPrefix:'FR', icon:'05',
    fields:[
      {key:'date', label:'Date', type:'date', required:true},
      {key:'facility', label:'Facility', type:'select', options:['Covered Court','Open Field'], default:'Covered Court', required:true},
      {key:'renterName', label:'Renter Name', type:'text', required:true},
      {key:'contact', label:'Contact No.', type:'text'},
      {key:'memberId', label:'Homeowner (if applicable)', type:'ref', ref:'members'},
      {key:'startTime', label:'Start Time', type:'time'},
      {key:'endTime', label:'End Time', type:'time'},
      {key:'numberOfHours', label:'Number of Hours', type:'number', required:true},
      {key:'ratePerHour', label:'Rate Per Hour', type:'number', required:true},
      {key:'amountPaid', label:'Amount Paid', type:'number', default:0},
      {key:'status', label:'Status', type:'select', options:['Unpaid','Partial','Paid'], default:'Unpaid'},
      {key:'paymentMethod', label:'Payment Method', type:'select', options:['Cash','Check','Bank Transfer','GCash','Other'], default:'Cash'},
      {key:'referenceNo', label:'Reference No.', type:'text'},
      {key:'notes', label:'Notes', type:'textarea', full:true},
    ],
    columns:['date','facility','renterName','numberOfHours','ratePerHour','rentalTotal','amountPaid','status'],
  },
  expenses: {

===================================================================== */
function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function singular(label){
  if(label.endsWith('ies')) return label.slice(0,-3)+'y';
  if(label.endsWith('s')) return label.slice(0,-1);
  return label;
}
function money(n){
  const v = Number(n||0);
  const sym = SETTINGS.currency==='PHP' ? '₱' : (SETTINGS.currency||'');
  return sym + v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}
function findRecord(mod, id){ return (cache[mod]||[]).find(r=>r.id===id); }
function memberName(id){ const m=findRecord('members',id); return m ? `${m.lastName}, ${m.firstName}` : (id?'—':'—'); }
function propertyTag(id){
  const p=findRecord('properties',id);
  if(!p) return id ? '—' : '—';
  return `<span class="bl-tag">B${esc(p.block)}&nbsp;·&nbsp;L${esc(p.lot)}</span>`;
}
function stampClass(status){ return String(status||'').toLowerCase().replace(/\s+/g,''); }
function monthsSinceBillingMonth(billingMonth){
  if(!billingMonth) return 0;
  const parts = String(billingMonth).split('-');
  const y = Number(parts[0]), m = Number(parts[1]);
  if(!y || !m) return 0;
  const now = new Date();
  return (now.getFullYear()-y)*12 + ((now.getMonth()+1)-m);
}
function isDelinquentBill(rec){
  return rec.status !== 'Paid' && monthsSinceBillingMonth(rec.billingMonth) >= 3;
}
function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._t); showToast._t=setTimeout(()=>t.classList.remove('show'),2200);
}
function todayISO(){ return new Date().toISOString().slice(0,10); }

===================================================================== */
let tableFilter = '';

function columnLabel(mod, colKey){
  const map = { name:'Name', blocklot:'Block · Lot', owner:'Owner', balance:'Balance', photo:'Photo', rentalTotal:'Total Amount' };
  if(map[colKey]) return map[colKey];
  const f = MODULES[mod].fields.find(f=>f.key===colKey);
  return f ? f.label : colKey;
}
function searchText(modKey, rec){
  const mod = MODULES[modKey];
  const parts = [JSON.stringify(rec)];
  mod.columns.forEach(colKey=>{
    try{ parts.push(String(cellValue(modKey, rec, colKey)||'').replace(/<[^>]+>/g,' ')); }catch(e){}
  });
  // also pull in resolved names for any ref fields not already covered by columns
  mod.fields.forEach(f=>{
    if(f.type==='ref'){
      if(f.ref==='members') parts.push(memberName(rec[f.key]));
      else if(f.ref==='properties'){ const p=findRecord('properties', rec[f.key]); if(p) parts.push(`B${p.block} L${p.lot} ${p.street||''}`); }
    }
  });
  return parts.join(' ').toLowerCase();
}
function cellValue(mod, rec, colKey){
  if(colKey==='name') return `${esc(rec.lastName||'')}, ${esc(rec.firstName||'')}`;
  if(colKey==='blocklot') return `<span class="bl-tag">B${esc(rec.block||'—')}&nbsp;·&nbsp;L${esc(rec.lot||'—')}</span>`;
  if(colKey==='owner') return memberName(rec.ownerMemberId) ? esc(memberName(rec.ownerMemberId)) : '—';
  if(colKey==='balance'){
    const bal = Math.max(0,(Number(rec.amountDue||0)-Number(rec.amountPaid||0)));
    return `<span class="num-cell">${money(bal)}</span>`;
  }
  if(colKey==='rentalTotal'){
    const total = Number(rec.numberOfHours||0) * Number(rec.ratePerHour||0);
    return `<span class="num-cell">${money(total)}</span>`;
  }
  const f = MODULES[mod].fields.find(f=>f.key===colKey);
  if(!f) return esc(rec[colKey]||'—');
  let v = rec[colKey];
  if(f.type==='ref'){
    if(f.ref==='members') return esc(memberName(v));
    if(f.ref==='properties') return propertyTag(v);
    if(f.ref==='billing'){ const b=findRecord('billing',v); return b ? `${esc(b.billingMonth||'')} · ${propertyTag(b.propertyId)}` : '—'; }
    return esc(v||'—');
  }
  if(f.type==='number') return `<span class="num-cell">${v!==undefined && v!==null && v!=='' ? money(v) : '—'}</span>`;
  if(mod==='billing' && f.key==='status' && isDelinquentBill(rec)){
    return `<span class="stamp delinquent" title="No payment recorded for 3+ months">Delinquent</span>`;
  }
  if(f.type==='select' && (f.key==='status'||f.key==='priority')) return `<span class="stamp ${stampClass(v)}">${esc(v||'—')}</span>`;
  if(f.type==='photo') return v ? `<img src="${v}" class="thumb">` : `<div class="thumb thumb-empty">${esc((rec.firstName||'?')[0])}${esc((rec.lastName||'?')[0])}</div>`;
  return v ? esc(v) : '—';
}

  document.querySelectorAll('[data-edit]').forEach(el=>el.addEventListener('click', ()=> openModal(modKey, el.dataset.edit)));

/* =====================================================================
   MODAL FORM (add / edit)
===================================================================== */
function refOptions(refMod){
  const data = cache[refMod]||[];
  return data.map(r=>{
    let label = r.id;
    if(refMod==='members') label = `${r.lastName}, ${r.firstName}`;
    if(refMod==='properties') label = `B${r.block}-L${r.lot}${r.street? ' · '+r.street:''}`;
    if(refMod==='billing') label = `${r.billingMonth||''} · B${(findRecord('properties',r.propertyId)||{}).block||''}`;
    return {value:r.id, label};
  });
}

function openModal(modKey, id){
  const mod = MODULES[modKey];
  const editing = !!id;
  const rec = editing ? findRecord(modKey, id) : {};

  const fieldsHtml = mod.fields.map(f=>{
    const val = rec[f.key] !== undefined ? rec[f.key] : (f.default!==undefined ? f.default : '');
    const fullClass = f.full ? 'full' : '';
    let input = '';
    if(f.type==='photo'){
      const thumbHtml = val ? `<img src="${val}" class="thumb" id="photoPreviewImg" style="width:64px;height:64px;">`
                             : `<div class="thumb thumb-empty" id="photoPreviewImg" style="width:64px;height:64px;font-size:18px;">?</div>`;
      input = `<div class="photo-upload">
        <span id="photoPreviewWrap">${thumbHtml}</span>
        <div>
          <input type="file" id="f_photo_file" accept="image/*"><br>
          <button type="button" class="photo-remove" id="photoRemoveBtn" style="display:${val?'inline':'none'};margin-top:6px;">Remove photo</button>
        </div>
      </div>
      <input type="hidden" id="f_${f.key}" value="${esc(val)}">`;
    }else if(f.type==='select'){
      input = `<select id="f_${f.key}">${f.options.map(o=>`<option value="${esc(o)}" ${val===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    }else if(f.type==='ref'){
      const opts = refOptions(f.ref);
      input = `<select id="f_${f.key}"><option value="">—</option>${opts.map(o=>`<option value="${esc(o.value)}" ${val===o.value?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`;
    }else if(f.type==='textarea'){
      input = `<textarea id="f_${f.key}">${esc(val)}</textarea>`;
    }else{
      input = `<input type="${f.type}" id="f_${f.key}" value="${esc(val)}">`;
    }
    return `<div class="field ${fullClass}"><label>${f.label}${f.required?' *':''}</label>${input}</div>`;
  }).join('');

  const modalHtml = `
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <div class="modal-head">
        <h3>${editing?'Edit':'New'} ${singular(mod.label)}</h3>
        <button class="modal-close" id="modalCloseBtn">×</button>
      </div>
      <div class="modal-body">${fieldsHtml}</div>
      <div class="modal-foot">
        <button class="btn btn-ghost" id="modalCancelBtn">Cancel</button>
        <button class="btn btn-gold" id="modalSaveBtn">${editing?'Save Changes':'Add '+singular(mod.label)}</button>
      </div>
    </div>
  </div>`;
  document.getElementById('modalRoot').innerHTML = modalHtml;

  const close = ()=>{ document.getElementById('modalRoot').innerHTML=''; };
  document.getElementById('modalCloseBtn').addEventListener('click', close);
  document.getElementById('modalCancelBtn').addEventListener('click', close);
  document.getElementById('modalBackdrop').addEventListener('click', e=>{ if(e.target.id==='modalBackdrop') close(); });

  if(modKey==='rentals'){
    const facilitySelect = document.getElementById('f_facility');
    const rateInput = document.getElementById('f_ratePerHour');
    const applyDefaultRate = ()=>{
      if(rateInput && rateInput.value === ''){
        rateInput.value = facilitySelect.value === 'Open Field' ? (SETTINGS.openFieldRate||0) : (SETTINGS.coveredCourtRate||0);
      }
    };
    if(facilitySelect && rateInput){
      if(!editing) applyDefaultRate();
      facilitySelect.addEventListener('change', ()=>{
        rateInput.value = facilitySelect.value === 'Open Field' ? (SETTINGS.openFieldRate||0) : (SETTINGS.coveredCourtRate||0);
      });
    }
  }

  const photoFileInput = document.getElementById('f_photo_file');
  if(photoFileInput){
    photoFileInput.addEventListener('change', ()=>{
      const file = photoFileInput.files[0];
      if(!file) return;
      if(file.size > 2*1024*1024){ showToast('Please choose an image under 2MB'); return; }
      const reader = new FileReader();
      reader.onload = ()=>{
        document.getElementById('f_photo').value = reader.result;
        document.getElementById('photoPreviewWrap').innerHTML = `<img src="${reader.result}" class="thumb" style="width:64px;height:64px;">`;
        document.getElementById('photoRemoveBtn').style.display = 'inline';
      };
      reader.readAsDataURL(file);
    });
    document.getElementById('photoRemoveBtn').addEventListener('click', ()=>{
      document.getElementById('f_photo').value = '';
      document.getElementById('photoPreviewWrap').innerHTML = `<div class="thumb thumb-empty" style="width:64px;height:64px;font-size:18px;">?</div>`;
      document.getElementById('photoRemoveBtn').style.display = 'none';
      photoFileInput.value = '';
    });
  }

  document.getElementById('modalSaveBtn').addEventListener('click', async ()=>{
    const newRec = editing ? {...rec} : {};
    let missingRequired = false;
    mod.fields.forEach(f=>{
      const el = document.getElementById('f_'+f.key);
      let v = el.value;
      if(f.type==='number') v = v==='' ? '' : Number(v);
      if(f.required && (v===''||v===undefined)) missingRequired = true;
      newRec[f.key] = v;
    });
    if(missingRequired){ showToast('Please fill in the required fields'); return; }

    const arr = cache[modKey] || [];
    if(editing){
      const idx = arr.findIndex(r=>r.id===id);
      arr[idx] = newRec;
    }else{
      newRec.id = nextId(mod.idPrefix, arr);
      arr.push(newRec);
    }
    await saveData(modKey, arr);
    close();
    showToast(editing ? 'Changes saved' : singular(mod.label)+' added');
    renderSidebar();
    renderModule(modKey);
  });
}

async function deleteRecord(modKey, id){
  if(!confirm('Delete this record? This cannot be undone.')) return;
  const arr = (cache[modKey]||[]).filter(r=>r.id!==id);
  await saveData(modKey, arr);
  showToast('Record deleted');
  renderSidebar();
  renderModule(modKey);
}

        payments = cache.payments||[], expenses = cache.expenses||[], rentals = cache.rentals||[];

  const unpaid = billing.filter(b=>b.status!=='Paid').length;
  const delinquentCount = billing.filter(b=>isDelinquentBill(b)).length;
  const totalCollected = payments.reduce((s,p)=>s+Number(p.amount||0),0);
  const totalExpenses = expenses.reduce((s,e)=>s+Number(e.amount||0),0);
  const totalRentalIncome = rentals.reduce((s,r)=>s+Number(r.amountPaid||0),0);
  const totalRentalBilled = rentals.reduce((s,r)=>s+(Number(r.numberOfHours||0)*Number(r.ratePerHour||0)),0);
  const rentalsPaid = rentals.filter(r=>r.status==='Paid').length;
  const rentalsUnpaid = rentals.filter(r=>r.status!=='Paid').length;
  const net = totalCollected + totalRentalIncome - totalExpenses;

  // group by month
  const byMonth = {};
  payments.forEach(p=>{ const m=(p.date||'').slice(0,7); if(!m) return; byMonth[m]=byMonth[m]||{in:0,out:0}; byMonth[m].in+=Number(p.amount||0); });
  rentals.forEach(r=>{ const m=(r.date||'').slice(0,7); if(!m) return; byMonth[m]=byMonth[m]||{in:0,out:0}; byMonth[m].in+=Number(r.amountPaid||0); });
  expenses.forEach(e=>{ const m=(e.date||'').slice(0,7); if(!m) return; byMonth[m]=byMonth[m]||{in:0,out:0}; byMonth[m].out+=Number(e.amount||0); });
  const months = Object.keys(byMonth).sort();

  const byCategory = {};
  expenses.forEach(e=>{ const c=e.category||'Other'; byCategory[c]=(byCategory[c]||0)+Number(e.amount||0); });

  const byFacility = {'Covered Court':0, 'Open Field':0};
  rentals.forEach(r=>{ byFacility[r.facility||'Covered Court'] = (byFacility[r.facility||'Covered Court']||0) + Number(r.amountPaid||0); });

  document.getElementById('content').innerHTML = `
  <div class="pagehead no-print"><h1>Reports</h1><p>Summary of association finances and membership.</p></div>
  <div class="print-only report-letterhead">
    <div class="receipt-hoa">${esc(SETTINGS.hoaName||'Lessandra Homeowners Association')}</div>
    <div class="receipt-addr">${esc(SETTINGS.address||'')}</div>
    <div class="receipt-title">FINANCIAL &amp; MEMBERSHIP REPORT — ${esc(todayISO())}</div>
  </div>
  <div class="panel no-print">
    <div class="panel-body">
      <button class="btn btn-gold" id="printReportBtn">Print Report</button>
    </div>
  </div>
  <div class="stat-grid">
    <div class="stat-card"><div class="stat-label">Homeowners</div><div class="stat-value">${members.length}</div></div>
    <div class="stat-card"><div class="stat-label">Properties</div><div class="stat-value">${properties.length}</div></div>
    <div class="stat-card"><div class="stat-label">Paid / Unpaid</div><div class="stat-value" style="font-size:22px;">${paid} / ${unpaid}</div></div>
    <div class="stat-card accent"><div class="stat-label">Delinquent (3+ mos.)</div><div class="stat-value" style="font-size:22px;">${delinquentCount}</div></div>
    <div class="stat-card"><div class="stat-label">Total Collected (Dues)</div><div class="stat-value" style="font-size:20px;">${money(totalCollected)}</div></div>
    <div class="stat-card"><div class="stat-label">Rental Income</div><div class="stat-value" style="font-size:20px;">${money(totalRentalIncome)}</div></div>
    <div class="stat-card"><div class="stat-label">Rentals Paid / Unpaid</div><div class="stat-value" style="font-size:22px;">${rentalsPaid} / ${rentalsUnpaid}</div></div>
    <div class="stat-card"><div class="stat-label">Total Expenses</div><div class="stat-value" style="font-size:20px;">${money(totalExpenses)}</div></div>
    <div class="stat-card accent"><div class="stat-label">Net Balance</div><div class="stat-value" style="font-size:20px;color:${net>=0?'var(--green)':'var(--red)'};">${money(net)}</div></div>
  </div>
  <div class="two-col">
    <div class="panel"><div class="panel-head"><h2>Collections vs Expenses</h2></div>
      <div class="panel-body"><div class="chart-wrap">${months.length?'<canvas id="chartMonthly"></canvas>':'<div class="empty-state"><span class="serif">No dated records yet</span>Add payments or expenses with dates to see trends.</div>'}</div></div>
    </div>
    <div class="panel"><div class="panel-head"><h2>Expenses by Category</h2></div>
      <div class="panel-body"><div class="chart-wrap">${Object.keys(byCategory).length?'<canvas id="chartCategory"></canvas>':'<div class="empty-state"><span class="serif">No expenses logged</span>Add an expense to see the breakdown.</div>'}</div></div>
    </div>
  </div>
  <div class="panel">
    <div class="panel-head"><h2>Facility Rental Income</h2></div>
    <div class="panel-body">
      ${rentals.length ? `
      <table><thead><tr><th>Facility</th><th style="text-align:right">Amount Collected</th></tr></thead><tbody>
        <tr><td>Covered Court</td><td class="num-cell">${money(byFacility['Covered Court']||0)}</td></tr>
        <tr><td>Open Field</td><td class="num-cell">${money(byFacility['Open Field']||0)}</td></tr>
        <tr><td><strong>Total Billed (incl. unpaid)</strong></td><td class="num-cell"><strong>${money(totalRentalBilled)}</strong></td></tr>
      </tbody></table>
      <div class="table-scroll no-print" style="margin-top:16px;">
        <table><thead><tr><th>ID</th><th>Date</th><th>Facility</th><th>Renter</th><th style="text-align:right">Total</th><th>Status</th><th></th></tr></thead><tbody>
          ${rentals.map(r=>{
            const total = Number(r.numberOfHours||0)*Number(r.ratePerHour||0);
            return `<tr>
              <td class="id-cell">${esc(r.id)}</td><td>${esc(r.date||'—')}</td><td>${esc(r.facility||'—')}</td><td>${esc(r.renterName||'—')}</td>
              <td class="num-cell">${money(total)}</td><td><span class="stamp ${stampClass(r.status)}">${esc(r.status||'—')}</span></td>
              <td><button class="btn-link-text" data-rental-receipt="${esc(r.id)}">Receipt</button></td>
            </tr>`;
          }).join('')}
        </tbody></table>
      </div>` : `<div class="empty-state"><span class="serif">No rentals logged yet</span>Add a Facility Rental to see income here.</div>`}
    </div>
  </div>`;

  document.querySelectorAll('[data-rental-receipt]').forEach(el=>el.addEventListener('click', ()=>{
    VIEW_RENTAL_ID = el.dataset.rentalReceipt; ROUTE='rentalView'; render();
  }));

  if(months.length){
    const ctx = document.getElementById('chartMonthly');
    chartRefs.monthly && chartRefs.monthly.destroy();
    chartRefs.monthly = new Chart(ctx, {
      type:'bar',
      data:{ labels:months, datasets:[
        {label:'Collected', data:months.map(m=>byMonth[m].in), backgroundColor:'#5B8266'},
        {label:'Expenses', data:months.map(m=>byMonth[m].out), backgroundColor:'#B0413E'},
      ]},
      options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom', labels:{font:{family:'IBM Plex Sans'}}}}, scales:{ y:{beginAtZero:true} } }
    });
  }
  if(Object.keys(byCategory).length){
    const ctx2 = document.getElementById('chartCategory');
    chartRefs.category && chartRefs.category.destroy();
    chartRefs.category = new Chart(ctx2, {
      type:'doughnut',
      data:{ labels:Object.keys(byCategory), datasets:[{ data:Object.values(byCategory), backgroundColor:['#C98A3D','#3D5A80','#5B8266','#B0413E','#8C93A6','#16233A','#A76F2C'] }]},
      options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom', labels:{boxWidth:12,font:{family:'IBM Plex Sans',size:11}}}} }
    });
  }
  document.getElementById('printReportBtn').addEventListener('click', ()=> window.print());
}

/* =====================================================================
   RECEIPT (single, printable)
===================================================================== */
function billForPayment(paymentId){
  const p = findRecord('payments', paymentId);
  if(!p) return null;
  const b = findRecord('billing', p.billId);
  return {payment:p, billing:b};
}
function receiptHtml(paymentId){
  const info = billForPayment(paymentId);
  if(!info || !info.payment) return `<div class="empty-state"><span class="serif">Select a payment</span>Pick a Payment ID above to generate a receipt.</div>`;
  const {payment, billing} = info;
  const property = billing ? findRecord('properties', billing.propertyId) : null;
  const owner = billing ? memberName(billing.memberId) : '—';
  const balance = billing ? Math.max(0, Number(billing.amountDue||0)-Number(billing.amountPaid||0)) : 0;
  const isPaidFull = balance <= 0;
  return `
  <div class="receipt-box" id="receiptPrintArea">
    <div class="receipt-hoa">${esc(SETTINGS.hoaName||'Lessandra Homeowners Association')}</div>
    <div class="receipt-addr">${esc(SETTINGS.address||'')}</div>
    <div class="receipt-title">OFFICIAL PAYMENT RECEIPT</div>
    <table class="receipt-table">
      <tr><td>Receipt No.</td><td>${esc(payment.id)}</td></tr>
      <tr><td>Date</td><td>${esc(payment.date||'—')}</td></tr>
      <tr><td>Received From</td><td>${esc(owner)}</td></tr>
      <tr><td>Property</td><td>${property?`B${esc(property.block)} - L${esc(property.lot)}`:'—'}</td></tr>
      <tr><td>Dues Month</td><td>${billing?esc(billing.billingMonth||'—'):'—'}</td></tr>
      <tr><td>Total Amount Due</td><td>${billing?money(billing.amountDue):'—'}</td></tr>
      <tr><td>Amount Paid (This Receipt)</td><td><strong>${money(payment.amount)}</strong></td></tr>
      <tr><td>Payment Method</td><td>${esc(payment.paymentMethod||'—')}</td></tr>
      <tr><td>Reference No.</td><td>${esc(payment.referenceNo||'—')}</td></tr>
      <tr><td>Outstanding Balance</td><td>${billing?money(balance):'—'}</td></tr>
    </table>
    <div class="receipt-status ${isPaidFull?'paidfull':'partial'}">${isPaidFull?'PAID IN FULL':'PARTIAL PAYMENT — BALANCE REMAINING'}</div>
    <div class="receipt-field">Received By: ${esc(payment.receivedBy||'—')}</div>
    <div class="receipt-sign">
      <div><div class="sig-line"></div><div class="sig-label">Homeowner / Payor Signature</div></div>
      <div><div class="sig-line"></div><div class="sig-label">Authorized Signature</div></div>
    </div>
    <div class="receipt-footer">This receipt is system-generated. Keep a copy for your records.</div>
  </div>`;
}
function renderReceipt(){
  const payments = cache.payments||[];
  const rentals = cache.rentals||[];
  document.getElementById('content').innerHTML = `
  <div class="pagehead no-print"><h1>Receipt</h1><p>Select a Monthly Due payment or Facility Rental to generate a printable receipt — works for full or partial payments.</p></div>
  <div class="panel no-print">
    <div class="panel-body" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
      <select id="receiptPaymentSelect" style="min-width:280px;">
        <option value="">— Select a Payment or Rental —</option>
        <optgroup label="Monthly Dues Payments">
          ${payments.map(p=>`<option value="payment:${esc(p.id)}">${esc(p.id)} — ${esc(memberName(p.memberId))} — ${money(p.amount)}</option>`).join('')}
        </optgroup>
        <optgroup label="Facility Rentals">
          ${rentals.map(r=>`<option value="rental:${esc(r.id)}">${esc(r.id)} — ${esc(r.facility||'')} — ${esc(r.renterName||'')}</option>`).join('')}
        </optgroup>
      </select>
      <button class="btn btn-gold" id="printReceiptBtn">Print Receipt</button>
      <button class="btn btn-ghost" id="printThermalBtn">🖨️ Thermal (80mm)</button>
    </div>
  </div>
  <div id="receiptContainer">${receiptHtml('')}</div>`;
  document.getElementById('receiptPaymentSelect').addEventListener('change', e=>{
    const val = e.target.value;
    if(!val){ document.getElementById('receiptContainer').innerHTML = receiptHtml(''); return; }
    const [type, id] = val.split(':');
    document.getElementById('receiptContainer').innerHTML = type==='rental' ? rentalHtml(id) : receiptHtml(id);
  });
  document.getElementById('printThermalBtn').addEventListener('click', ()=>{
    const sel = document.getElementById('receiptPaymentSelect').value;
    if(!sel){ showToast('Select a payment or rental first'); return; }
    const [type, id] = sel.split(':');
    const body = type==='rental' ? rentalThermalBody(id) : receiptThermalBody(id);
    if(!body){ showToast('Could not find that record'); return; }
    printThermal(body, 'Receipt '+id);
  });
  document.getElementById('printReceiptBtn').addEventListener('click', ()=>{
    const sel = document.getElementById('receiptPaymentSelect').value;
    if(!sel){ showToast('Select a payment or rental first'); return; }
    window.print();
  });
}

/* =====================================================================
   BATCH RECEIPTS (many, printed together)
===================================================================== */
function renderBatchReceipts(){
  const payments = cache.payments||[];
  const rentals = cache.rentals||[];
  const months = [...new Set([
    ...(cache.billing||[]).map(b=>b.billingMonth),
    ...rentals.map(r=>(r.date||'').slice(0,7))
  ].filter(Boolean))].sort();
  document.getElementById('content').innerHTML = `
  <div class="pagehead no-print"><h1>Batch Receipts</h1><p>Pick several Monthly Dues payments and/or Facility Rentals — each prints on its own page.</p></div>
  <div class="panel no-print">
    <div class="panel-body">
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px;">
        <label style="font-size:12.5px;color:var(--text-soft);">Filter by month:</label>
        <select id="batchMonthFilter"><option value="">All months</option>${months.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('')}</select>
      </div>
      <div class="navgroup-label" style="padding-left:0;">Monthly Dues Payments</div>
      <div id="batchCheckListPayments" style="max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:16px;"></div>
      <div class="navgroup-label" style="padding-left:0;">Facility Rentals</div>
      <div id="batchCheckListRentals" style="max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:10px;"></div>
      <div style="margin-top:14px;">
        <button class="btn btn-gold" id="printBatchBtn">Print Selected Receipts</button>
        <button class="btn btn-ghost" id="printBatchThermalBtn">🖨️ Print Thermal (80mm)</button>
      </div>
    </div>
  </div>
  <div id="batchReceiptContainer"></div>`;

  function paymentBillingMonth(p){ const b=findRecord('billing', p.billId); return b ? b.billingMonth : ''; }
  function renderCheckList(){
    const filterMonth = document.getElementById('batchMonthFilter').value;

    const filteredPayments = payments.filter(p=> !filterMonth || paymentBillingMonth(p)===filterMonth);
    const payList = document.getElementById('batchCheckListPayments');
    payList.innerHTML = filteredPayments.length ? filteredPayments.map(p=>`
      <label style="display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:13px;border-bottom:1px solid var(--line);">
        <input type="checkbox" class="batchCheck" value="payment:${esc(p.id)}">
        ${esc(p.id)} — ${esc(memberName(p.memberId))} — ${money(p.amount)} — ${esc(p.date||'')}
      </label>`).join('') : `<div class="empty-state" style="padding:14px;">No payments match.</div>`;

    const filteredRentals = rentals.filter(r=> !filterMonth || (r.date||'').slice(0,7)===filterMonth);
    const rentList = document.getElementById('batchCheckListRentals');
    rentList.innerHTML = filteredRentals.length ? filteredRentals.map(r=>{
      const total = Number(r.numberOfHours||0)*Number(r.ratePerHour||0);
      return `
      <label style="display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:13px;border-bottom:1px solid var(--line);">
        <input type="checkbox" class="batchCheck" value="rental:${esc(r.id)}">
        ${esc(r.id)} — ${esc(r.facility||'')} — ${esc(r.renterName||'')} — ${money(total)} — ${esc(r.date||'')}
      </label>`;
    }).join('') : `<div class="empty-state" style="padding:14px;">No facility rentals match.</div>`;
  }
  renderCheckList();
  document.getElementById('batchMonthFilter').addEventListener('change', renderCheckList);
  document.getElementById('printBatchBtn').addEventListener('click', ()=>{
    const checked = [...document.querySelectorAll('.batchCheck:checked')].map(c=>c.value);
    if(!checked.length){ showToast('Select at least one item'); return; }
    document.getElementById('batchReceiptContainer').innerHTML = checked.map(val=>{
      const [type, id] = val.split(':');
      const html = type==='rental' ? rentalHtml(id) : receiptHtml(id);
      return `<div class="print-page">${html}</div>`;
    }).join('');
    window.print();
  });
  document.getElementById('printBatchThermalBtn').addEventListener('click', ()=>{
    const checked = [...document.querySelectorAll('.batchCheck:checked')].map(c=>c.value);
    if(!checked.length){ showToast('Select at least one item'); return; }
    const bodies = checked.map(val=>{
      const [type, id] = val.split(':');
      return type==='rental' ? rentalThermalBody(id) : receiptThermalBody(id);
    }).filter(Boolean);
    if(!bodies.length){ showToast('Could not find those records'); return; }
    printThermal(bodies.join('<div style="border-top:1px dashed #000;margin:10px 0;"></div>'), 'Batch Receipts');
  });
}

      <div class="field"><label>Default Monthly Due</label><input type="number" id="s_monthlyDue" value="${esc(SETTINGS.monthlyDue)}"></div>
      <div class="field"><label>Currency</label><select id="s_currency"><option value="PHP" ${SETTINGS.currency==='PHP'?'selected':''}>PHP (₱)</option><option value="USD" ${SETTINGS.currency==='USD'?'selected':''}>USD ($)</option></select></div>
      <div class="field"><label>Contact Number</label><input type="text" id="s_contactNumber" value="${esc(SETTINGS.contactNumber)}"></div>
      <div class="field"><label>Email</label><input type="email" id="s_email" value="${esc(SETTINGS.email)}"></div>
      <div class="field"><label>Covered Court Rate (per hour)</label><input type="number" id="s_coveredCourtRate" value="${esc(SETTINGS.coveredCourtRate!==undefined?SETTINGS.coveredCourtRate:200)}"></div>
      <div class="field"><label>Open Field Rate (per hour)</label><input type="number" id="s_openFieldRate" value="${esc(SETTINGS.openFieldRate!==undefined?SETTINGS.openFieldRate:150)}"></div>
      <div class="field full"><label>Access PIN</label><input type="text" id="s_pin" value="${esc(SETTINGS.pin||'1234')}" maxlength="8"></div>
      <div class="field full"><div class="banner-note" style="margin:0;">The Access PIN is a simple lock for this device only — it is not an account system. Change it here anytime; you'll need it again next time you tap "Lock / Log out".</div></div>
    </div>
    <div class="modal-foot"><button class="btn btn-gold" id="saveSettingsBtn">Save Settings</button></div>
  </div>

  <div class="panel">
    <div class="panel-head"><h2>Backup &amp; Export</h2></div>
    <div class="panel-body">
      <p style="margin:0 0 14px;font-size:13px;color:var(--text-soft);">Download a full copy of the registry as an Excel file — one sheet per section (Homeowners, Properties, Monthly Dues, and so on). Good for reading, printing, or sharing — but not meant for restoring back into the app (see below for that). Uses the same filename each time, so your browser can overwrite the previous copy instead of piling up dated versions.</p>
      <button class="btn btn-gold" id="exportBackupBtn">Download Full Backup (.xlsx)</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h2>Restore Backup</h2></div>
    <div class="panel-body">
      <p style="margin:0 0 10px;font-size:13px;color:var(--text-soft);"><strong>Step 1 — save a data backup regularly:</strong> this is a separate file made specifically for restoring — it preserves every link between records exactly, and reuses the same filename each time so it overwrites your last backup instead of stacking up copies.</p>
      <button class="btn btn-ghost" id="exportJsonBtn" style="margin-bottom:16px;">Download Data Backup (.json)</button>
      <p style="margin:0 0 10px;font-size:13px;color:var(--text-soft);"><strong>Step 2 — restore when needed:</strong> choose a data backup file (.json) to load it back in.</p>
      <div class="banner-note">Restoring replaces everything currently saved in this browser with the contents of the file. This can't be undone — export a fresh backup first if you're unsure.</div>
      <input type="file" id="restoreFileInput" accept=".json,application/json" style="margin-top:6px;">
    </div>
  </div>`;

  document.getElementById('saveSettingsBtn').addEventListener('click', async ()=>{
    SETTINGS = {
      hoaName: document.getElementById('s_hoaName').value || 'Lessandra Homeowners Association',
      address: document.getElementById('s_address').value,
      monthlyDue: Number(document.getElementById('s_monthlyDue').value||0),
      currency: document.getElementById('s_currency').value,
      contactNumber: document.getElementById('s_contactNumber').value,
      email: document.getElementById('s_email').value,
      coveredCourtRate: Number(document.getElementById('s_coveredCourtRate').value||0),
      openFieldRate: Number(document.getElementById('s_openFieldRate').value||0),
      pin: document.getElementById('s_pin').value.trim() || '1234',
    };
    await saveData('settings', SETTINGS);
    showToast('Settings saved');
    renderSidebar();
  });
  document.getElementById('exportBackupBtn').addEventListener('click', exportFullBackup);
  document.getElementById('exportJsonBtn').addEventListener('click', exportJSONBackup);
  document.getElementById('restoreFileInput').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    restoreFromBackupFile(file);
    e.target.value = '';
  });
}

/* =====================================================================
   ROUTER
===================================================================== */
function render(){
  renderSidebar();
  if(ROUTE==='dashboard') renderDashboard();
  else if(ROUTE==='reports') renderReports();
  else if(ROUTE==='settings') renderSettings();
  else if(ROUTE==='receipt') renderReceipt();
  else if(ROUTE==='batchReceipts') renderBatchReceipts();
  else if(ROUTE==='announcementView') renderAnnouncementView();
  else if(ROUTE==='rentalView') renderRentalView();
  else renderModule(ROUTE);
}

/* =====================================================================
   EXPORT / BACKUP
===================================================================== */
function moduleRowsForExport(modKey){
  const mod = MODULES[modKey];
  const data = cache[modKey]||[];
  return data.map(rec=>{
    const row = {ID: rec.id};
    mod.fields.forEach(f=>{
      if(f.type==='photo') return;
      let v = rec[f.key];
      if(f.type==='ref'){
        if(f.ref==='members') v = memberName(rec[f.key]) !== '—' ? memberName(rec[f.key]) : '';
        else if(f.ref==='properties'){ const p=findRecord('properties', rec[f.key]); v = p ? `B${p.block}-L${p.lot}` : ''; }
        else v = rec[f.key] || '';
      }
      row[f.label] = v===undefined||v===null ? '' : v;
    });
    return row;
  });
}
/* =====================================================================
   THERMAL RECEIPT PRINTING (80mm roll printers)
   Opens a separate minimal print window sized for thermal paper, so it
   doesn't affect the normal Letter/A4 print styles used everywhere else.
===================================================================== */
function printThermal(bodyHtml, title){
  const win = window.open('', '_blank', 'width=380,height=640');
  if(!win){ showToast('Please allow pop-ups to print the thermal receipt'); return; }
  win.document.write(`<!DOCTYPE html><html><head><title>${esc(title||'Receipt')}</title>
    <meta charset="UTF-8">
    <style>
      @page { size: 80mm auto; margin: 3mm; }
      *{ box-sizing:border-box; }
      body{ font-family:'Courier New', Courier, monospace; font-size:11.5px; color:#000; margin:0; padding:0 2mm; width:74mm; }
      .t-hoa{ text-align:center; font-weight:bold; font-size:13.5px; margin-bottom:1px; }
      .t-addr{ text-align:center; font-size:9.5px; margin-bottom:5px; }
      .t-title{ text-align:center; font-weight:bold; font-size:11.5px; border-top:1px dashed #000; border-bottom:1px dashed #000; padding:4px 0; margin-bottom:6px; letter-spacing:.03em; }
      table{ width:100%; border-collapse:collapse; margin-bottom:6px; }
      td{ padding:2px 0; vertical-align:top; font-size:11px; }
      td:first-child{ color:#000; }
      td:last-child{ text-align:right; font-weight:bold; }
      .t-status{ text-align:center; font-weight:bold; font-size:11px; border-top:1px dashed #000; border-bottom:1px dashed #000; padding:5px 0; margin-bottom:8px; }
      .t-sign{ margin:14px 0 6px; font-size:10px; }
      .t-sign .line{ border-top:1px solid #000; margin-top:20px; padding-top:2px; text-align:center; }
      .t-footer{ text-align:center; font-size:9px; margin-top:8px; border-top:1px dashed #000; padding-top:5px; }
      .t-cut{ text-align:center; font-size:9px; margin-top:10px; }
    </style></head><body>${bodyHtml}<div class="t-cut">✂ - - - - - - - - - - - - - - - -</div></body></html>`);
  win.document.close();
  win.focus();
  setTimeout(()=>{ win.print(); }, 250);
}
function thermalRow(label, value, bold){
  return `<tr><td>${esc(label)}</td><td${bold?' style="font-size:12px;"':''}>${value}</td></tr>`;
}
function receiptThermalBody(paymentId){
  const info = billForPayment(paymentId);
  if(!info || !info.payment) return null;
  const {payment, billing} = info;
  const property = billing ? findRecord('properties', billing.propertyId) : null;
  const owner = billing ? memberName(billing.memberId) : '—';
  const balance = billing ? Math.max(0, Number(billing.amountDue||0)-Number(billing.amountPaid||0)) : 0;
  const isPaidFull = balance <= 0;
  return `
    <div class="t-hoa">${esc(SETTINGS.hoaName||'Lessandra HOA')}</div>
    <div class="t-addr">${esc(SETTINGS.address||'')}</div>
    <div class="t-title">OFFICIAL RECEIPT</div>
    <table>
      ${thermalRow('Receipt No.', esc(payment.id))}
      ${thermalRow('Date', esc(payment.date||'—'))}
      ${thermalRow('From', esc(owner))}
      ${thermalRow('Property', property?`B${esc(property.block)}-L${esc(property.lot)}`:'—')}
      ${thermalRow('Dues Month', billing?esc(billing.billingMonth||'—'):'—')}
      ${thermalRow('Amount Due', billing?money(billing.amountDue):'—')}
      ${thermalRow('Amount Paid', money(payment.amount), true)}
      ${thermalRow('Method', esc(payment.paymentMethod||'—'))}
      ${thermalRow('Ref. No.', esc(payment.referenceNo||'—'))}
      ${thermalRow('Balance', billing?money(balance):'—')}
    </table>
    <div class="t-status">${isPaidFull?'PAID IN FULL':'PARTIAL — BALANCE REMAINING'}</div>
    <div class="t-sign">
      <div class="line">Homeowner / Payor Signature</div>
      <div class="line">Authorized Signature</div>
    </div>
    <div class="t-footer">System-generated receipt. Keep for your records.</div>`;
}
function rentalThermalBody(id){
  const rec = findRecord('rentals', id);
  if(!rec) return null;
  const total = Number(rec.numberOfHours||0) * Number(rec.ratePerHour||0);
  const balance = Math.max(0, total - Number(rec.amountPaid||0));
  const statusText = rec.status==='Paid' ? 'PAID IN FULL' : (rec.status==='Partial' ? 'PARTIAL — BALANCE REMAINING' : 'UNPAID');
  return `
    <div class="t-hoa">${esc(SETTINGS.hoaName||'Lessandra HOA')}</div>
    <div class="t-addr">${esc(SETTINGS.address||'')}</div>
    <div class="t-title">FACILITY RENTAL RECEIPT</div>
    <table>
      ${thermalRow('Receipt No.', esc(rec.id))}
      ${thermalRow('Date', esc(rec.date||'—'))}
      ${thermalRow('Facility', esc(rec.facility||'—'))}
      ${thermalRow('Renter', esc(rec.renterName||'—'))}
      ${rec.startTime||rec.endTime ? thermalRow('Time', `${esc(rec.startTime||'—')}-${esc(rec.endTime||'—')}`) : ''}
      ${thermalRow('Hours', esc(rec.numberOfHours||'—'))}
      ${thermalRow('Rate/Hr', money(rec.ratePerHour))}
      ${thermalRow('Total', money(total), true)}
      ${thermalRow('Amount Paid', money(rec.amountPaid), true)}
      ${thermalRow('Method', esc(rec.paymentMethod||'—'))}
      ${thermalRow('Balance', money(balance))}
    </table>
    <div class="t-status">${statusText}</div>
    <div class="t-sign">
      <div class="line">Renter Signature</div>
      <div class="line">Authorized Signature</div>
    </div>
    <div class="t-footer">System-generated receipt. Keep for your records.</div>`;
}

function downloadBlob(content, filename, type){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportModuleCSV(modKey){
  if(typeof XLSX === 'undefined'){ showToast('Export needs an internet connection'); return; }
  const rows = moduleRowsForExport(modKey);
  if(!rows.length){ showToast('Nothing to export yet'); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const csv = XLSX.utils.sheet_to_csv(ws);
  downloadBlob(csv, `${MODULES[modKey].label}_${todayISO()}.csv`, 'text/csv;charset=utf-8;');
  showToast('CSV downloaded');
}
function exportFullBackup(){
  if(typeof XLSX === 'undefined'){ showToast('Export needs an internet connection'); return; }
  const wb = XLSX.utils.book_new();
  MODULE_ORDER.forEach(key=>{
    const rows = moduleRowsForExport(key);
    const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{}]);
    XLSX.utils.book_append_sheet(wb, ws, MODULES[key].label.slice(0,31));
  });
  const settingsRows = Object.entries(SETTINGS).filter(([k])=>k!=='pin').map(([k,v])=>({Setting:k, Value:v}));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(settingsRows), 'Settings');
  const safeName = (SETTINGS.hoaName||'HOA').replace(/[^a-z0-9]+/gi,'_');
  XLSX.writeFile(wb, `${safeName}_Backup.xlsx`);
  showToast('Backup downloaded');
}

/* =====================================================================
   RESTORE BACKUP
   The .xlsx backup above is for reading/printing/sharing — it converts
   linked records (owner names, property tags) to display text, which
   can't be reliably matched back to exact IDs. This JSON backup instead
   stores the raw data exactly as the app keeps it, so restoring from it
   reproduces everything — including all the links between records —
   exactly as it was.
===================================================================== */
function exportJSONBackup(){
  const payload = { hoaBackup: true, exportedAt: new Date().toISOString(), settings: SETTINGS, data: {} };
  MODULE_ORDER.forEach(key=>{ payload.data[key] = cache[key] || []; });
  const safeName = (SETTINGS.hoaName||'HOA').replace(/[^a-z0-9]+/gi,'_');
  downloadBlob(JSON.stringify(payload, null, 2), `${safeName}_DataBackup.json`, 'application/json');
  showToast('Data backup downloaded');
}
function restoreFromBackupFile(file){
  const reader = new FileReader();
  reader.onload = async ()=>{
    let parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(e){ showToast('That file is not a valid backup (couldn\'t read it)'); return; }
    if(!parsed || !parsed.data || typeof parsed.data !== 'object'){
      showToast('That file doesn\'t look like a Lessandra data backup');
      return;
    }
    const confirmed = confirm('Restoring will REPLACE all current data in this browser with the contents of this backup. This cannot be undone. Continue?');
    if(!confirmed) return;
    for(const key of MODULE_ORDER){
      const rows = Array.isArray(parsed.data[key]) ? parsed.data[key] : [];
      await saveData(key, rows);
    }
    if(parsed.settings && typeof parsed.settings === 'object'){
      SETTINGS = Object.assign({}, SETTINGS, parsed.settings);
      await saveData('settings', SETTINGS);
    }
    showToast('Backup restored');
    ROUTE = 'dashboard';
    render();
  };
  reader.onerror = ()=>{ showToast('Could not read that file'); };
  reader.readAsText(file);
}

/* =====================================================================
   LOGIN GATE
   PIN + unlock state are both stored locally in this browser only.
===================================================================== */
async function getSession(){
  try{
    const raw = localStorage.getItem(STORE_PREFIX+'session');
    return raw ? JSON.parse(raw) : {unlocked:false};
  }catch(e){ return {unlocked:false}; }
}
async function saveSession(unlocked){
  try{ localStorage.setItem(STORE_PREFIX+'session', JSON.stringify({unlocked})); }catch(e){}
}

function showLoginScreen(){
  document.getElementById('sidebar').style.display='none';
  document.getElementById('topbar').style.display='none';
  document.getElementById('content').innerHTML='';
  document.getElementById('modalRoot').innerHTML = `
    <div id="loginScreen">
      <div class="login-card">
        <div class="lock-icon">🔒</div>
        <h2>${esc(SETTINGS.hoaName||'Lessandra Homeowners Association')}</h2>
        <p>Enter the association PIN to open the registry.</p>
        <input type="password" inputmode="numeric" id="loginPin" placeholder="••••" autofocus>
        <div class="login-error" id="loginError"></div>
        <button class="btn btn-gold" id="loginBtn">Unlock</button>
      </div>
    </div>`;
  const tryUnlock = async ()=>{
    const val = document.getElementById('loginPin').value.trim();
    if(val === String(SETTINGS.pin||'1234')){
      UNLOCKED = true;
      await saveSession(true);
      document.getElementById('modalRoot').innerHTML='';
      document.getElementById('sidebar').style.display='';
      document.getElementById('topbar').style.display='';
      render();
    }else{
      document.getElementById('loginError').textContent = 'Incorrect PIN — try again.';
      document.getElementById('loginPin').value='';
      document.getElementById('loginPin').focus();
    }
  };
  document.getElementById('loginBtn').addEventListener('click', tryUnlock);
  document.getElementById('loginPin').addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });
}

async function init(){
  try{
    const testKey = STORE_PREFIX+'__test__';
    localStorage.setItem(testKey, '1');
    localStorage.removeItem(testKey);
  }catch(e){
    STORAGE_OK = false;
    const banner = document.createElement('div');
    banner.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#B0413E;color:#fff;padding:10px 16px;font-size:12.5px;text-align:center;z-index:500;font-family:IBM Plex Sans,sans-serif;';
    banner.innerHTML = 'Local storage is blocked in this window (common in private/incognito mode) — nothing will be saved after you close this tab. Try a normal browser window instead. <button style="margin-left:10px;background:none;border:1px solid #fff;color:#fff;border-radius:4px;padding:2px 8px;cursor:pointer;" onclick="this.parentElement.remove()">Dismiss</button>';
    document.body.appendChild(banner);
  }

  SETTINGS = await loadData('settings', SETTINGS);
  for(const key of MODULE_ORDER){ await loadData(key, []); }
  const session = await getSession();
  if(session.unlocked){
    UNLOCKED = true;
    render();
  }else{
    showLoginScreen();
  }
}
init();
</script>
